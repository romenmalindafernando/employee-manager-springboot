
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <h1 class="text-center mb-4">Edit Employee</h1>

    <div class="card shadow-sm">

        <div class="card-header bg-warning">
            <h4 class="mb-0">Update Employee Information</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/employees/{id}/update(id=${employee.id})}"
                  th:object="${employee}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           th:field="*{fullName}"
                           class="form-control"
                           required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text"
                           th:field="*{phone}"
                           class="form-control"
                           required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text"
                           th:field="*{department}"
                           class="form-control"
                           required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('department')}"
                         th:errors="*{department}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number"
                           th:field="*{salary}"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('salary')}"
                         th:errors="*{salary}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Update Employee
                    </button>

                    <a th:href="@{/employees}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
