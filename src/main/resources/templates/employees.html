
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">Employee Management System</h1>

    <!-- Employee Registration Form -->
    <div class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Register New Employee</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/employees}"
                  th:object="${employee}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}"
                           class="form-control" required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}"
                           class="form-control" required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" th:field="*{phone}"
                           class="form-control" required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" th:field="*{department}"
                           class="form-control" required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('department')}"
                         th:errors="*{department}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" th:field="*{salary}"
                           class="form-control"
                           min="0.01" step="0.01" required>
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('salary')}"
                         th:errors="*{salary}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Register Employee
                </button>

            </form>

        </div>
    </div>

    <!-- Employee List -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Registered Employees</h4>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="7" class="text-center text-muted">
                            No employees registered yet.
                        </td>
                    </tr>

                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}"></td>
                        <td th:text="${emp.fullName}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.phone}"></td>
                        <td th:text="${emp.department}"></td>
                        <td th:text="${emp.salary}"></td>

                        <td>
                            <a th:href="@{/employees/{id}/edit(id=${emp.id})}"
                               class="btn btn-warning btn-sm mb-1">
                                Edit
                            </a>

                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-danger btn-sm mb-1"
                                        onclick="return confirm('Delete this employee?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
